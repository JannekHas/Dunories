org.gradle.jvmargs=-Xmx3g -XX:ActiveProcessorCount=6 -Dfile.encoding=UTF-8
# Schonend für den PC (läuft parallel zu Spielen): niedrige Priorität, Java sieht nur 6 bzw. 4 von 16 Threads
# (begrenzt Compiler-, R8- und GC-Threads → Build bleibt bei etwa einem Drittel der CPU), RAM begrenzt
org.gradle.priority=low
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2g -XX:ActiveProcessorCount=4
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
